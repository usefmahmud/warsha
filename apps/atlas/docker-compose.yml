services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas:1.0.0
    container_name: atlas
    restart: unless-stopped
    ports:
      - "${BIND_IP}:8090:3456"   # الشبكة الخاصة فقط — مش متاح على الإنترنت
    environment:
      ATLAS_ENV: production
      ATLAS_SECRET_KEY: ${ATLAS_SECRET_KEY:?set ATLAS_SECRET_KEY in .env}
      ATLAS_DATABASE_URL: sqlite:////data/atlas.db
      ATLAS_STATIC_DIR: /app/static
      ATLAS_ALLOW_REGISTRATION: ${ATLAS_ALLOW_REGISTRATION:-true}
      ATLAS_CORS_ORIGINS: http://${BIND_IP}:8090,http://localhost:8090
    volumes:
      - ./data:/data
    mem_limit: 900m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3456/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
