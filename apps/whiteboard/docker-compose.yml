services:
  whiteboard:
    build: { context: ., dockerfile: Dockerfile }
    image: whiteboard:1.0.0
    container_name: whiteboard
    restart: unless-stopped
    ports:
      - "${BIND_IP}:8093:8000"
    environment:
      WB_ENV: production
      WB_DATABASE_URL: sqlite:////data/whiteboard.db
      WB_STATIC_DIR: /app/static
    volumes:
      - ./data:/data
    mem_limit: 500m
    memswap_limit: 500m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
